name: open_remote_control
description: "Controle remoto open source para Windows via rede local"
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: ^3.12.1

dependencies:
  cryptography: 2.9.0
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  mobile_scanner: 7.4.2
  open_remote_core:
    path: ../packages/remote_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/mark.svg
    - assets/branding/mark.png
