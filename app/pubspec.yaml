name: open_remote_control
description: "Controle remoto open source para Windows via rede local"
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.12.1

dependencies:
  cryptography: 2.9.0
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  mobile_scanner: 7.4.2
  package_info_plus: 10.2.2
  qr: ^3.0.2
  tray_manager: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/mark.svg
    - assets/branding/mark.png
    - assets/tray_icon.ico
    - assets/dashboard/index.html
    - assets/dashboard/dashboard.css
    - assets/dashboard/dashboard.js
    - assets/dashboard/LICENSE.tailwindcss
    - assets/dashboard/LICENSE.daisyui
    - assets/dashboard/LICENSE.tailwindcss-cli
