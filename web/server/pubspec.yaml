name: open_remote_server
description: Open Remote Windows host with a tray icon and browser dashboard.
publish_to: none
version: 0.4.1+11
environment:
  sdk: ^3.12.1
dependencies:
  cryptography: 2.9.0
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  open_remote_core:
    path: ../../packages/remote_core
  qr: ^3.0.2
  tray_manager: ^0.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  assets:
    - assets/tray_icon.ico
    - assets/branding/mark.svg
    - assets/dashboard/
    - assets/dashboard/assets/
